// Hybrid storage: window.storage (Claude preview) -> localStorage -> memory
const Stor={
  async get(k){
    if(typeof window!=='undefined'&&window.storage){
      try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null}catch(e){return null}
    }
    try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}
  },
  async set(k,v){
    if(typeof window!=='undefined'&&window.storage){
      try{await window.storage.set(k,JSON.stringify(v))}catch(e){}return;
    }
    try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
  }
};

// ── Helpers ──────────────────────────────────────────────────
function estNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}))}
function estStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tdy(){return estStr(estNow())}
function dateAdd(ds,n){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return estStr(d)}
function dateOff(n){return dateAdd(tdy(),-n)}
function dcFor(ds){return DC[new Date(ds+"T12:00:00").getDay()]}

function getDepTime(ds,cDeps,camps){
  if(cDeps&&cDeps[ds])return cDeps[ds];
  const dow=new Date(ds+"T12:00:00").getDay();
  if(dow===0||dow===6)return null;
  for(const c of(camps||CAMP_DEF)){if(ds>=c.start&&ds<=c.end)return c.time}
  if(ds<="2026-05-28")return"07:30";
  return null;
}
function getDayLabel(ds,cDeps,camps){
  if(!getDepTime(ds,cDeps,camps))return null;
  const dow=new Date(ds+"T12:00:00").getDay();
  for(const c of(camps||CAMP_DEF)){if(ds>=c.start&&ds<=c.end&&dow>=1&&dow<=5)return c.label}
  return ds<="2026-05-28"?"School":null;
}
function getMilestones(dep){
  if(!dep)return[];
  return[{taskId:"morning_routine",label:"Morning routine done",icon:"🌅",due:dep}];
}
function fmtT(t){if(!t)return"";const[hh,mm]=t.split(":");const hr=parseInt(hh);return(hr===0?12:hr>12?hr-12:hr)+":"+(mm||"00")+(hr>=12?" PM":" AM")}
function fullDate(ds){const d=new Date(ds+"T12:00:00");return DLFULL[d.getDay()]+', '+MFULL[d.getMonth()]+' '+d.getDate()}
function fmtDateShort(ds){const d=new Date(ds+"T12:00:00");const di=DORD.indexOf(DC[d.getDay()]);return DLF[di]+' '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fmtDateTiny(ds){const d=new Date(ds+"T12:00:00");const di=DORD.indexOf(DC[d.getDay()]);return{dow:DL[di],day:d.getDate()}}

function tasksForDate(tasks,ds,kid,cDeps,camps){
  const dc=dcFor(ds);const dep=getDepTime(ds,cDeps,camps);
  const hasAct=tasks.some(t=>t.cat==="activity"&&t.sched&&t.sched[ds]&&(!kid||!t.forKid||t.forKid==="both"||t.forKid===kid));
  return tasks.filter(t=>{
    if(t.cat==="morning"){if(!dep&&!hasAct)return false}
    else if(t.sched!==undefined){if(!t.sched[ds])return false}
    else if(t.cat!=="bonus"){if(!t.days||!t.days.includes(dc))return false}
    if(kid&&t.forKid&&t.forKid!=="both"&&t.forKid!==kid)return false;
    return true;
  });
}
function tPts(task,kid){return kid==="kid2"&&!task.rt?task.pts+1:task.pts}

function streakFor(appr,kid,tid){let s=0;for(let i=0;i<60;i++){if(appr[`${kid}-${tid}-${dateOff(i)}`])s++;else if(i===0)continue;else break;}return s}
function rStr(appr,kid){return streakFor(appr,kid,"reading")}
function pStr(appr,kid){return streakFor(appr,kid,"piano")}
function exStr(appr,kid,tasks){
  let s=0;
  for(let i=0;i<60;i++){const d=dateOff(i);if(appr[`${kid}-exercise-${d}`]||isExcused(tasks,d))s++;else if(i===0)continue;else break;}
  return s;
}
function sMul(s){return s>=4?2:1}

function isExcused(tasks,ds){
  return tasks.some(t=>{
    if(t.cat!=="activity"||t.forKid==="kid2")return false;
    const e=t.sched&&t.sched[ds];if(!e||typeof e!=='object')return false;
    if(t.id.startsWith("bb_")&&(e.durationMins||0)>=120)return true;
    if(t.id==="bb_game"&&(e.count||1)>=2)return true;
    return false;
  });
}

function weekOf(ds){const d=new Date(ds+"T12:00:00");const dow=d.getDay();d.setDate(d.getDate()+(dow===0?-6:1-dow));return estStr(d)}
function weekDates(mon){const out=[];for(let i=0;i<7;i++){const d=new Date(mon+"T12:00:00");d.setDate(d.getDate()+i);out.push(estStr(d))}return out}
function allChoresDone(appr,kid,mon){return WK_IDS.every(cid=>weekDates(mon).some(d=>appr[`${kid}-${cid}-${d}`]))}

function calcLatePen(ts,dep){
  if(!dep||!ts)return 0;
  const sub=new Date(new Date(ts).toLocaleString('en-US',{timeZone:'America/New_York'}));
  const[dh,dm]=dep.split(':').map(Number);
  const lateMin=Math.floor((sub.getHours()*3600+sub.getMinutes()*60+sub.getSeconds()-(dh*3600+dm*60))/60);
  return lateMin>5?-10*Math.floor(lateMin/5):0;
}
function get2Weeks(){const mon=weekOf(tdy());const out=[];for(let i=0;i<14;i++){const d=new Date(mon+"T12:00:00");d.setDate(d.getDate()+i);out.push(estStr(d))}return out}
function getLastTimes(sched){const dates=Object.keys(sched||{}).sort();for(let i=dates.length-1;i>=0;i--){const tm=sched[dates[i]];if(tm&&typeof tm==='object'&&(tm.at||tm.rb))return{at:tm.at||'',rb:tm.rb||''}}return{at:'',rb:''}}

function Conf({on}){const[p,set]=useState([]);useEffect(()=>{if(!on)return;set(Array.from({length:35},(_,i)=>({i,x:Math.random()*100,d:Math.random()*.6,c:["#FFD700","#FF6B6B","#4ECDC4","#45B7D1","#96E6A1","#DDA0DD","#FF9F43"][i%7],s:6+Math.random()*9})));const t=setTimeout(()=>set([]),2500);return()=>clearTimeout(t)},[on]);if(!p.length)return null;return h('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,pointerEvents:'none',zIndex:9999}},...p.map(x=>h('div',{key:x.i,style:{position:'absolute',left:x.x+'%',top:'-10px',width:x.s,height:x.s,borderRadius:x.s>10?'50%':'2px',backgroundColor:x.c,animation:`cFall 1.8s ease-in ${x.d}s forwards`}})))}
function PopEl({v,p}){if(!v)return null;return h('div',{style:{position:'fixed',top:'40%',left:'50%',transform:'translate(-50%,-50%)',fontSize:'3.2rem',fontWeight:900,color:p>0?'#FFD700':'#EF4444',textShadow:p>0?'0 0 20px rgba(255,215,0,.5),2px 2px 0 #B8860B':'0 0 20px rgba(239,68,68,.5)',animation:'pUp 1s ease-out forwards',zIndex:9998,pointerEvents:'none'}},(p>0?'+':'')+p+' pts')}
